name: Sync backend OpenAPI docs (manual)

on:
  workflow_dispatch:
    inputs:
      openapi_urls:
        description: >-
          Space/comma-separated list of per-service /v1/openapi.json URLs to
          merge (the backend is split into independent services; there is no
          single aggregated spec). Required in CI, where the script's default
          localhost sources are unreachable.
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # Without check-latest, setup-node uses the runner's cached 24.x, which can lag the
          # newest patch (24.21.0 instead of 24.22.1 on 2026-10-23).
          check-latest: true

      - name: Sync backend OpenAPI
        env:
          BACKEND_OPENAPI_URLS: ${{ github.event.inputs.openapi_urls }}
        run: npx --yes tsx scripts/sync-backend-openapi.ts

      - name: Install Mint CLI
        run: npm install -g mint@latest

      - name: Validate docs build
        run: mint validate
        continue-on-error: true

      - name: Check broken links
        run: mint broken-links
