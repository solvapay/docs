name: Sync SDK docs

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-sdk-docs]
  schedule:
    - cron: '0 5 * * 1'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout docs repo
        uses: actions/checkout@v4

      - name: Checkout SDK source repo
        uses: actions/checkout@v4
        with:
          repository: solvapay/solvapay-sdk
          path: _sdk
          sparse-checkout: |
            docs
            python/docs
            go/docs
          sparse-checkout-cone-mode: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # Without check-latest, setup-node uses the runner's cached 24.x, which can lag the
          # newest patch (24.21.0 instead of 24.22.1 on 2026-10-23).
          check-latest: true

      - name: Sync SDK docs
        run: npx --yes tsx scripts/sync-sdk-docs.ts
        env:
          SDK_REPO_DIR: ${{ github.workspace }}/_sdk

      # Drop the SDK tree before mint/PR so plan markdown and extra MDX
      # cannot fail validation or get committed into the docs repo.
      - name: Remove SDK checkout
        run: rm -rf "$GITHUB_WORKSPACE/_sdk"

      - name: Install Mint CLI
        run: npm install -g mint@latest

      - name: Validate docs build
        run: mint validate

      - name: Check broken links
        run: mint broken-links

      - name: Create sync PR
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/sync-sdk-docs
          title: "chore(docs): sync SDK docs"
          body: |
            Automated sync of `sdks/typescript/**`, `sdks/python/**` and `sdks/go/**` from the solvapay-sdk repo.

            - Ran `npx --yes tsx scripts/sync-sdk-docs.ts`
            - Ran `mint validate`
            - Ran `mint broken-links`
          commit-message: "chore(docs): sync SDK docs"
